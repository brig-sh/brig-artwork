<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --navy: #0E2233;
    --paper: #F2EFE6;
    --brass: #B9761C;
    --muted: #4A5866;
    --line: rgba(14, 34, 51, 0.14);
  }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--navy);
    font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
    position: relative;
  }
  /* GitHub safe area: 80px on every side */
  .card {
    position: absolute; inset: 80px;
    display: flex; align-items: center; gap: 64px;
  }
  .mark { width: 400px; height: 354px; flex-shrink: 0; object-fit: contain; }
  .text { display: flex; flex-direction: column; gap: 22px; }
  h1 {
    margin: 0; font-weight: 600; font-size: 84px; letter-spacing: -0.02em; line-height: 1;
  }
  p {
    margin: 0; font-size: 30px; line-height: 1.3; font-weight: 500; color: var(--muted);
    max-width: 600px;
  }
  .keys { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .key { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 500; color: var(--muted); }
  kbd {
    font-family: "SF Mono", Menlo, monospace; font-size: 20px; font-weight: 600;
    color: var(--navy); background: #FBFAF6;
    border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 8px;
    padding: 5px 12px; min-width: 104px; text-align: center;
  }
  .owner {
    font-family: "SF Mono", Menlo, monospace; font-size: 24px; font-weight: 600;
    color: var(--brass); margin-bottom: -10px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="herdr-brig-mark.png" alt="">
    <div class="text">
      <div class="owner">brig-sh /</div>
      <h1>herdr-brig</h1>
      <p>Every herdr agent in its own Brig microVM.</p>
      <div class="keys">
        <div class="key"><kbd>ctrl+b m</kbd> new sandbox, Claude Code started</div>
        <div class="key"><kbd>ctrl+b M</kbd> remove it, the project stays</div>
      </div>
    </div>
  </div>
</body>
</html>
